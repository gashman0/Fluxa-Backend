name: Fluxa Backend CI

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main
      - dev

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      # - name: Run Lint
      #   run: npm run lint

      # - name: Run Tests
      #   run: npm test

      - name: Install Render CLI
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          curl -fsSL https://raw.githubusercontent.com/render-oss/cli/main/bin/install.sh | bash

      - name: Deploy to Render
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -e

          if [ -z "$RENDER_API_KEY" ]; then
            echo "❌ RENDER_API_KEY is not set"
            exit 1
          fi

          if [ -z "$RENDER_SERVICE_ID" ]; then
            echo "❌ RENDER_SERVICE_ID is not set"
            exit 1
          fi

          echo "🚀 Deploying commit $GITHUB_SHA to Render..."

          render deploys create "$RENDER_SERVICE_ID" \
            --commit "$GITHUB_SHA" \
            --wait \
            --confirm